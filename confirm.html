<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Confirm your email — HAF CleverPay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f1eb;color:#1e252b;font-family:Inter,Montserrat,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.bar{background:#2f373e;padding:16px 22px;display:flex;align-items:center}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-m{background:#f18e00;color:#fff;font-family:Montserrat,Arial,sans-serif;font-weight:800;font-size:18px;width:34px;height:34px;line-height:34px;text-align:center;border-radius:9px}
.logo-t{color:#fff;font-family:Montserrat,Arial,sans-serif;font-weight:800;font-size:17px;letter-spacing:.5px}
.logo-t span{color:#f18e00}
.page{max-width:520px;margin:0 auto;padding:34px 18px 60px}
.card{background:#fff;border-radius:18px;padding:38px 30px 34px;text-align:center;box-shadow:0 2px 18px rgba(30,37,43,.07)}
.icon{width:66px;height:66px;border-radius:50%;margin:0 auto 20px;display:flex;align-items:center;justify-content:center}
.icon svg{width:30px;height:30px;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.icon.wait{background:#fdf1dd;color:#f18e00}
.icon.good{background:#e4f5ea;color:#1c8a4a}
.icon.bad{background:#fbe7e7;color:#c0392b}
h1{font-family:Montserrat,Arial,sans-serif;font-weight:800;font-size:25px;line-height:1.25;margin:0 0 12px}
p{font-size:15px;line-height:1.65;color:#4c545a;margin:0 0 14px}
.ref{display:inline-block;background:#faf7f1;border-radius:11px;padding:9px 16px;font-family:Montserrat,Arial,sans-serif;font-weight:800;letter-spacing:1.2px;font-size:15px;color:#2f373e;margin-top:4px}
.btn{display:inline-block;margin-top:20px;background:#f18e00;color:#fff;text-decoration:none;font-weight:700;font-size:15px;padding:14px 32px;border-radius:999px;border:0;cursor:pointer;font-family:Inter,Arial,sans-serif}
.btn.dark{background:#2f373e}
.next{margin-top:24px;background:#faf7f1;border-radius:14px;padding:18px 20px;text-align:left}
.next h2{font-family:Montserrat,Arial,sans-serif;font-size:14px;font-weight:800;margin:0 0 8px;color:#2f373e}
.next p{font-size:13.5px;margin:0;color:#4c545a}
.foot{text-align:center;color:#6b7278;font-size:12.5px;line-height:1.8;padding-top:24px}
.foot a{color:#a06000}
.spin{animation:sp 1.1s linear infinite;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:420px){.card{padding:30px 20px 28px}h1{font-size:22px}}
</style>
</head>
<body>

<header class="bar">
  <a href="index.html" class="logo">
    <div class="logo-m">H</div>
    <div class="logo-t">Clever<span>Pay</span></div>
  </a>
</header>

<main class="page">
  <div class="card">
    <div class="icon wait" id="ic">
      <svg viewBox="0 0 24 24" class="spin"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-dasharray="42 14"/></svg>
    </div>
    <h1 id="ttl">Confirming your email…</h1>
    <p id="msg">One moment — we're checking your link.</p>
    <div id="extra"></div>
  </div>
  <div class="foot">
    HAF Group &middot; Sheffield, UK<br>
    Need a hand? Email <a href="mailto:info@usehaf.co.uk">info@usehaf.co.uk</a>
  </div>
</main>

<script>
/* Self-serve email confirmation.
   The applicant's browser calls one database function with the token from their
   own email. The public key can do nothing else with it — it cannot read the
   applications table, cannot list references, and cannot set the flag without a
   token it could only have got from that person's inbox. */
var SB_URL='https://jsdwvogsxlnczzbefwgp.supabase.co';
var SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpzZHd2b2dzeGxuY3p6YmVmd2dwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzODgyMzYsImV4cCI6MjA5Njk2NDIzNn0.pxqM-Oh4f_3PlqCbKIKvcKZnNRUZ1ASKqqdNg78M_4M';

var ICONS={
  good:'<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" stroke="currentColor"/></svg>',
  bad:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor"/><line x1="12" y1="8" x2="12" y2="13" stroke="currentColor"/><line x1="12" y1="16.4" x2="12" y2="16.5" stroke="currentColor"/></svg>'
};

function qs(k){
  var m=new RegExp('[?&]'+k+'=([^&#]*)').exec(window.location.search);
  return m?decodeURIComponent(m[1].replace(/\+/g,' ')):'';
}
function paint(kind,title,message,extra){
  var ic=document.getElementById('ic');
  ic.className='icon '+(kind==='good'?'good':'bad');
  ic.innerHTML=ICONS[kind==='good'?'good':'bad'];
  document.getElementById('ttl').textContent=title;
  document.getElementById('msg').innerHTML=message;
  document.getElementById('extra').innerHTML=extra||'';
}
/* Never show the raw reference back unless we know the link was genuine —
   echoing whatever is in the address bar would turn this page into a mirror
   for anything a stranger typed. */
function refBox(ref){return '<div class="ref">'+ref.replace(/[^A-Za-z0-9-]/g,'').toUpperCase()+'</div>';}

var HELP='If you got this link in an email from us and it isn\'t working, just reply to that email and we\'ll sort it out.';

function run(){
  var ref=qs('ref'), tok=qs('t');
  if(!ref||!tok){
    paint('bad','This link is incomplete',
      'It looks like part of the web address was cut off — some email apps break long links across two lines.<br><br>Open the email again and tap the <b>Confirm my email</b> button rather than copying the address.',
      '<a class="btn dark" href="index.html">Go to the portal</a>');
    return;
  }
  var xhr=new XMLHttpRequest();
  xhr.open('POST',SB_URL+'/rest/v1/rpc/cleverpay_confirm_email',true);
  xhr.setRequestHeader('Content-Type','application/json');
  xhr.setRequestHeader('apikey',SB_ANON);
  xhr.setRequestHeader('Authorization','Bearer '+SB_ANON);
  xhr.onload=function(){
    var r={};
    try{r=JSON.parse(xhr.responseText)}catch(e){}
    if(xhr.status<200||xhr.status>=300){
      paint('bad','We couldn\'t reach us just now',
        'Nothing is wrong with your link — our end didn\'t answer. Please try again in a minute.',
        '<button class="btn" onclick="run()">Try again</button>');
      return;
    }
    if(r.ok){
      var hi=r.fname?('Thanks, '+r.fname.charAt(0)+r.fname.slice(1).toLowerCase()+' — your'):'Your';
      var done=r.already
        ? hi+' email address was already confirmed. Nothing more to do.'
        : hi+' email address is confirmed.';
      paint('good', r.already?'Already confirmed':'Email confirmed',
        done,
        refBox(ref)+
        '<div class="next"><h2>Your next step</h2><p>'+
        (r.status==='approved'
          ? 'Sign in to see which HAF services are open for your account.'
          : r.status==='rejected'
            ? 'Sign in to see the decision and the route available to you.'
            : 'Sign in to see exactly what is complete, upload anything we need and follow your review.')+
        '</p></div>'+
        '<a class="btn" href="index.html">Sign in to my HAF account</a>');
      return;
    }
    if(r.reason==='expired'){
      paint('bad','This link has expired',
        'Confirmation links last 30 days. Reply to any email from us and we\'ll send you a fresh one straight away.',
        '<a class="btn dark" href="status.html">Check my application</a>');
    } else if(r.reason==='blocked'){
      paint('bad','We can\'t confirm this account',
        'Please email <a href="mailto:info@usehaf.co.uk">info@usehaf.co.uk</a> and we\'ll pick it up with you directly.','');
    } else {
      paint('bad','This link doesn\'t work',
        'It may have been typed by hand, cut in half by an email app, or replaced by a newer one.<br><br>'+HELP,
        '<a class="btn dark" href="status.html">Check my application</a>');
    }
  };
  xhr.onerror=function(){
    paint('bad','We couldn\'t reach us just now',
      'Nothing is wrong with your link — our end didn\'t answer. Please try again in a minute.',
      '<button class="btn" onclick="run()">Try again</button>');
  };
  xhr.send(JSON.stringify({p_ref:ref,p_token:tok}));
}
run();
</script>
</body>
</html>
