<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Reset your PIN — HAF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f1eb;color:#1e252b;font-family:Inter,Montserrat,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.bar{background:#2f373e;padding:16px 22px;display:flex;align-items:center}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-m{background:#f18e00;color:#fff;font-family:Montserrat,Arial,sans-serif;font-weight:800;font-size:18px;width:34px;height:34px;line-height:34px;text-align:center;border-radius:9px}
.logo-t{color:#fff;font-family:Montserrat,Arial,sans-serif;font-weight:800;font-size:17px;letter-spacing:.5px}
.logo-t span{color:#f18e00}
.page{max-width:520px;margin:0 auto;padding:34px 18px 60px}
.card{background:#fff;border-radius:18px;padding:38px 30px 34px;box-shadow:0 2px 18px rgba(30,37,43,.07)}
.icon{width:66px;height:66px;border-radius:50%;margin:0 auto 20px;display:flex;align-items:center;justify-content:center}
.icon svg{width:30px;height:30px;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.icon.wait{background:#fdf1dd;color:#f18e00}
.icon.good{background:#e4f5ea;color:#1c8a4a}
.icon.bad{background:#fbe7e7;color:#c0392b}
h1{font-family:Montserrat,Arial,sans-serif;font-weight:800;font-size:25px;line-height:1.25;margin:0 0 12px;text-align:center}
p{font-size:15px;line-height:1.65;color:#4c545a;margin:0 0 14px;text-align:center}
p.left{text-align:left}
label{display:block;font-size:13px;font-weight:600;color:#2f373e;margin:16px 0 6px}
input{width:100%;padding:14px 16px;border:1.5px solid #e3ded5;border-radius:12px;font-size:16px;font-family:Inter,Arial,sans-serif;background:#fbfaf7;color:#1e252b}
input:focus{outline:none;border-color:#f18e00;background:#fff}
.btn{display:block;width:100%;margin-top:22px;background:#f18e00;color:#fff;text-decoration:none;text-align:center;font-weight:700;font-size:15px;padding:15px 32px;border-radius:999px;border:0;cursor:pointer;font-family:Inter,Arial,sans-serif}
.btn[disabled]{opacity:.6;cursor:default}
.btn.dark{background:#2f373e}
.err{display:none;background:#fbe7e7;color:#992d22;border-radius:11px;padding:11px 14px;font-size:13.5px;margin-top:14px;text-align:left}
.hint{font-size:12.5px;color:#6b7278;margin-top:10px;text-align:center}
.foot{text-align:center;color:#6b7278;font-size:12.5px;line-height:1.8;padding-top:24px}
.foot a{color:#a06000}
.spin{animation:sp 1.1s linear infinite;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:420px){.card{padding:30px 20px 28px}h1{font-size:22px}}
</style>
</head>
<body>

<header class="bar">
  <a href="index.html" class="logo">
    <div class="logo-m">H</div>
    <div class="logo-t">Clever<span>Pay</span></div>
  </a>
</header>

<main class="page">
  <div class="card">
    <div class="icon wait" id="ic">
      <svg viewBox="0 0 24 24" class="spin"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-dasharray="42 14"/></svg>
    </div>
    <h1 id="ttl">One moment…</h1>
    <p id="msg">Checking your link.</p>
    <div id="body"></div>
    <div class="err" id="err"></div>
  </div>
  <div class="foot">
    Your PIN opens HAF KNECT, PLNA and this portal — one PIN, every door.<br>
    Stuck? <a href="mailto:support@usehaf.co.uk">support@usehaf.co.uk</a>
  </div>
</main>

<script>
/* ── Reset a forgotten PIN ────────────────────────────────────────────────────
   Two jobs on one page.

   With no link: ask for a HAF username and record a request. The answer is the
   same whether or not that account exists — otherwise this page becomes a way
   for a stranger to find out who is on the network.

   With a link (?t=…): the token proves the person reached the email address on
   their own application, so the new PIN can be set. The PIN itself never leaves
   the browser: it is hashed here, in both the formats HAF stores, and only the
   hashes are sent. One is what KNECT and PLNA check, the other is what this
   portal checks — written together so a new PIN opens every door at once.
   ────────────────────────────────────────────────────────────────────────── */
const PLNA_URL='https://ggkpqqrtxtlafdkxcaqg.supabase.co';
const PLNA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdna3BxcXJ0eHRsYWZka3hjYXFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxOTM2NjAsImV4cCI6MjA5Nzc2OTY2MH0.hB70KOYZu4dshwhsrxF_dFyBn0n72gStWTwxYGsLdgY';
const ICONS={
  wait:'<svg viewBox="0 0 24 24" class="spin"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-dasharray="42 14"/></svg>',
  key:'<svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4" stroke="currentColor"/><path d="M11 12l8-8M17 6l2 2M15 8l2 2" stroke="currentColor"/></svg>',
  good:'<svg viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 7" stroke="currentColor"/></svg>',
  bad:'<svg viewBox="0 0 24 24"><path d="M12 7v6M12 17h.01" stroke="currentColor"/><circle cx="12" cy="12" r="9" stroke="currentColor"/></svg>',
  sent:'<svg viewBox="0 0 24 24"><path d="M3 6h18v12H3z" stroke="currentColor"/><path d="M3 7l9 6 9-6" stroke="currentColor"/></svg>'
};
const $=id=>document.getElementById(id);
function show(kind,title,message,html){
  $('ic').className='icon '+(kind==='good'||kind==='sent'?'good':kind==='bad'?'bad':'wait');
  $('ic').innerHTML=ICONS[kind]||ICONS.wait;
  $('ttl').textContent=title;
  $('msg').innerHTML=message;
  $('body').innerHTML=html||'';
}
function fail(text){const e=$('err');e.textContent=text;e.style.display='block'}
function clearFail(){$('err').style.display='none'}
async function sha256(s){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function rpc(name,payload){
  const r=await fetch(PLNA_URL+'/rest/v1/rpc/'+name,{method:'POST',
    headers:{'apikey':PLNA_KEY,'Authorization':'Bearer '+PLNA_KEY,'Content-Type':'application/json'},
    body:JSON.stringify(payload)});
  if(!r.ok) throw new Error('rpc');
  return r.json();
}

/* ── ask for a link ── */
function askForm(){
  show('key','Reset your PIN',
    'Enter your HAF username and we’ll email a link to the address on your application — nowhere else.',
    '<label for="u">HAF username</label>'+
    '<input id="u" placeholder="e.g. JW012390" autocapitalize="characters" autocomplete="username" maxlength="14">'+
    '<button class="btn" id="go">Email me a reset link</button>'+
    '<p class="hint">Don’t know your username? It’s on your application emails.</p>');
  $('u').addEventListener('input',function(){this.value=this.value.toUpperCase()});
  $('u').addEventListener('keydown',e=>{if(e.key==='Enter')request()});
  $('go').addEventListener('click',request);
}
async function request(){
  clearFail();
  const u=$('u').value.trim().toUpperCase();
  if(u.length<4){fail('Enter your HAF username — it looks like JW012390.');return}
  $('go').disabled=true;$('go').textContent='Sending…';
  try{ await rpc('request_pin_reset',{p_id:u}); }
  catch(e){ /* the message below is deliberately the same either way */ }
  show('sent','Check your email',
    'If that account exists, a reset link is on its way to the address on the application. It works once and lasts two hours.',
    '<a class="btn dark" href="index.html">Back to sign in</a>');
}

/* ── set a new PIN ── */
function pinForm(username){
  show('key','Choose a new PIN',
    'Signing in as <strong>'+username.replace(/[<>&]/g,'')+'</strong>. Pick 4 to 6 digits — this PIN opens KNECT, PLNA and this portal.',
    '<label for="p1">New PIN</label>'+
    '<input id="p1" type="password" inputmode="numeric" maxlength="6" placeholder="4–6 digits" autocomplete="new-password">'+
    '<label for="p2">Confirm PIN</label>'+
    '<input id="p2" type="password" inputmode="numeric" maxlength="6" placeholder="Re-enter PIN" autocomplete="new-password">'+
    '<button class="btn" id="save">Save my new PIN</button>');
  $('p2').addEventListener('keydown',e=>{if(e.key==='Enter')savePin(username)});
  $('save').addEventListener('click',()=>savePin(username));
}
async function savePin(username){
  clearFail();
  const a=$('p1').value.trim(), b=$('p2').value.trim();
  if(!/^\d{4,6}$/.test(a)){fail('Your PIN must be 4 to 6 digits — numbers only.');return}
  if(a!==b){fail('The two PINs don’t match — please re-enter them.');return}
  $('save').disabled=true;$('save').textContent='Saving…';
  try{
    const relay=await sha256(username+':'+a);
    const cp=await sha256('HAF-CP|'+username+'|'+a);
    const out=await rpc('complete_pin_reset',{p_token:TOKEN,p_relay_hash:relay,p_cp_hash:cp});
    if(!out||out.error){
      show('bad','That link has expired','A reset link works once and lasts two hours. Ask for a new one and it will be with you shortly.',
        '<a class="btn" href="reset.html">Get a new link</a>');
      return;
    }
    show('good','Your new PIN is set',
      'Use your HAF username and your new PIN to sign in — on HAF KNECT, on PLNA and here.',
      '<a class="btn" href="https://knect.usehaf.co.uk">Go to HAF KNECT</a>'+
      '<a class="btn dark" href="index.html">Go to the CleverPay portal</a>');
  }catch(e){
    $('save').disabled=false;$('save').textContent='Save my new PIN';
    fail('Connection problem — please try again.');
  }
}

/* ── which of the two jobs is this ── */
const TOKEN=(new URLSearchParams(location.search).get('t')||'').trim();
(async function(){
  if(!TOKEN){askForm();return}
  try{
    const chk=await rpc('check_pin_reset',{p_token:TOKEN});
    if(chk&&chk.valid&&chk.username){pinForm(chk.username);return}
    show('bad','That link has expired','A reset link works once and lasts two hours. Ask for a new one and it will be with you shortly.',
      '<a class="btn" href="reset.html">Get a new link</a>');
  }catch(e){
    show('bad','We couldn’t check that link','Please try the link again in a moment, or ask for a new one.',
      '<a class="btn" href="reset.html">Get a new link</a>');
  }
})();
</script>
</body>
</html>
